; Arranca MT5 con IndexPropBot en un gráfico de NAS100 M5 (cuenta con la que esté conectado el terminal).
; Lo usa mt5/arrancar_bot_demo.bat. El gráfico queda guardado en el perfil: las siguientes veces basta abrir MT5.
[Experts]
AllowLiveTrading=1
AllowDllImport=0
Enabled=1
[StartUp]
Expert=IndexPropBot
ExpertParameters=IndexPropBot_fondeo_100k.set
Symbol=NAS100
Period=M5
