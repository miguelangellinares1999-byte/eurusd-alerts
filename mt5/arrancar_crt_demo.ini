; Arranca MT5 con CRTPropBot en un gráfico de NAS100 M15 (cuenta con la que esté conectado el terminal:
; debe ser la demo de 5.000 USD, no la de IndexPropBot). Lo usa mt5/arrancar_crt_demo.bat.
[Experts]
AllowLiveTrading=1
AllowDllImport=0
Enabled=1
[StartUp]
Expert=CRTPropBot
ExpertParameters=CRTPropBot_BlackBull_demo_5k.set
Symbol=NAS100
Period=M15
