symbol: EURUSD
timeframe_minutes: 15

data_source:
  type: mt5               # única fuente: MetaTrader 5 (solo Windows, terminal abierto y con sesión)
  lookback_days: 5        # historial descargado en cada ciclo en vivo (debe cubrir el día anterior)
  mt5:
    symbol: "EURUSD"      # tal como lo llama tu bróker: EURUSD, EURUSD.r, EURUSDm...
    # MT5 da las horas en la hora del SERVIDOR del bróker. Desfase fijo servidor - UTC en horas
    # (p.ej. 2 = GMT+2). OJO: casi todos los brókers cambian de GMT+2 a GMT+3 en verano;
    # un desfase fijo solo es correcto media temporada -> usa server_timezone para backtests.
    server_utc_offset_hours: 2
    # true = al conectar estima el desfase comparando la hora del último tick con la hora UTC
    # actual (si el mercado está cerrado usa server_utc_offset_hours). Solo vale para el presente.
    auto_detect_offset: false
    # Opcional, con horario de verano. Si se define, prevalece sobre las dos opciones anteriores.
    # "NY+7" = hora de Nueva York + 7 (GMT+2 invierno / GMT+3 verano, la mayoría de brókers),
    # o un nombre IANA ("Europe/Athens", "UTC"). Ejecuta check_mt5.py para saber cuál necesitas.
    server_timezone: "NY+7"
    # Credenciales opcionales en .env: MT5_LOGIN, MT5_PASSWORD, MT5_SERVER, MT5_PATH
  yahoo:                  # type: yahoo (o variable DATA_SOURCE=yahoo, la usa GitHub Actions)
    ticker: "EURUSD=X"

detector:
  swing_n: 2                     # velas a cada lado para un pivote
  max_setup_hours: 8             # se descarta el setup si no se completa en X horas desde el sweep
  fvg_max_bars_after_choch: 1    # velas tras el CHoCH en las que aún puede cerrarse el FVG
  min_fvg_pips: 0                # tamaño mínimo del FVG
  pip_size: 0.0001
  one_alert_per_level_per_day: true

trading_day:
  close_hour: 17                 # el día cierra a las 17:00...
  timezone: America/New_York     # ...hora de Nueva York

session_filter:
  enabled: false                 # true = solo se aceptan sweeps dentro de las sesiones listadas
  sessions: [london, newyork]
  definitions:                   # horas SIEMPRE entre comillas
    london:  {timezone: Europe/London,    start: "07:00", end: "16:00"}
    newyork: {timezone: America/New_York, start: "08:00", end: "17:00"}

# Estrategia del curso chart.wzrd (detector/chartz.py). De momento solo se usa en
# `python main.py compare`; las alertas en vivo siguen siendo las de PDH/PDL.
chartz:
  combo: scalping          # scalping = estructura M15, POI M5, CDC M1 | intradia = 1H, M15, M5
  entry: close             # close = al cierre de la vela del CDC | open = apertura del OB (entrada 1) | mid = 50% del OB
  require_fvg: true        # el impulso del OB/CDC debe dejar ineficiencia
  require_liquidity_grab: true
  require_irl: true        # IRL formada y barrida antes de tocar el POI
  min_risk_pips: 1
  killzones:               # 3 h desde la apertura de Londres y de NY (pág. 51)
    enabled: true
    sessions: [london, newyork]
    definitions:
      london:  {timezone: Europe/London,    start: "08:00", end: "11:00"}
      newyork: {timezone: America/New_York, start: "08:00", end: "11:00"}

# Daily Cycle (detector/daily_cycle.py) en vivo para otro par, en paralelo a EURUSD PDH/PDL.
# M15: sweep + CHoCH de una sola vela con FVG, sesgo del TR de 4H, killzone de Londres.
daily_cycle:
  enabled: true
  dry_run: false           # true = solo log y diario en state_path, sin email
  symbol: GBPUSD
  mt5_symbol: GBPUSD
  yahoo_ticker: "GBPUSD=X"
  pip_size: 0.0001
  bias_minutes: 240
  windows: [[2, 5]]        # horas NY en las que puede darse el CHoCH (killzone de Londres)
  tp_r: 2
  lookback_days: 40        # historial M15 por pasada (el TR de 4H necesita semanas)
  state_path: state/daily_cycle_gbpusd.json

# Alerta semanal de barridas en S&P 500 y Nasdaq 100 (index_alerts.py, `python main.py index-alert`).
# En GitHub Actions corre los sábados por la mañana (.github/workflows/index-alert.yml).
index_alerts:
  enabled: true
  dry_run: false           # true = el informe va al log en vez de por email
  capital: 10000           # capital de la cuenta para calcular lotes (o variable INDEX_CAPITAL)
  risk_pct: 2              # % del capital arriesgado por operación
  tp_r: 3                  # objetivo en múltiplos del riesgo
  breadth_below: 30        # amplitud del S&P 500 (% sobre su media de 50) que se considera sobreventa
  min_risk_pct: 0.5        # se ignoran barridas con el SL a menos de este % de la entrada
  lot_step: 0.01           # lote mínimo / incremento en MT5
  weekly_summary: true     # email todas las semanas, aunque no haya señal
  state_path: state/index_alerts.json
  symbols:                 # contract_size = unidades del índice por lote (míralo en MT5: especificación del símbolo)
    - {ticker: "^GSPC", name: "S&P 500", mt5: US500, contract_size: 1}
    - {ticker: "^NDX", name: "Nasdaq 100", mt5: NAS100, contract_size: 1}

# Alerta semanal de rotación sectorial (sector_alerts.py, `python main.py sector-alert`).
# Acciones de los sectores líderes (fuerza relativa de los ETFs SPDR frente a SPY, sobre su MM40)
# con SPY alcista: dos semanas alcistas con FVG, barrida del último low semanal y cierre encima.
# Backtest 2000-2026 (backtest/sector_rotation.py): ~11 %/año, DD ~35 %. Sábados en GitHub Actions
# (.github/workflows/sector-alert.yml).
sector_alerts:
  enabled: true
  dry_run: false           # true = el informe va al log en vez de por email
  universe: ambos          # sp500, ndx (Nasdaq 100) o ambos
  capital: 10000           # capital de la cuenta para calcular acciones (o variable SECTOR_CAPITAL)
  risk_pct: 1              # % del capital arriesgado por operación
  max_positions: 10        # posiciones abiertas a la vez como máximo
  max_alloc_pct: 20        # nocional máximo por posición en % del capital (sin apalancamiento)
  top: 4                   # sectores líderes en los que se buscan entradas
  window: 10               # semanas tras el impulso con FVG en las que vale la barrida
  tp_r: 3                  # objetivo en múltiplos del riesgo
  min_risk_pct: 1          # se ignoran barridas con el SL a menos de este % de la entrada
  lot_step: 1              # acciones mínimas por orden
  weekly_summary: true     # email todas las semanas, aunque no haya señal
  state_path: state/sector_alerts.json

# Alerta diaria de reversión a la media en SPY y QQQ (etf_alerts.py, `python main.py etf-alert`).
# RSI(2) < 10 sobre la MM200, salida al cerrar sobre la MM5 o a las 10 sesiones, stop 3 ATR.
# Se ejecuta antes del cierre de EE. UU. para entrar al cierre (.github/workflows/etf-alert.yml).
etf_alerts:
  enabled: true
  dry_run: false           # true = el aviso va al log en vez de por email
  capital: 10000           # capital de la cuenta (o variable ETF_CAPITAL)
  alloc_pct: 50            # % del capital por ETF (como en el backtest: mitad SPY, mitad QQQ)
  stop_atr: 3
  max_days: 10
  lot_step: 1              # acciones mínimas por orden en MT5
  window: ["15:00", "16:00"]  # hora de Nueva York en la que se comprueba la señal
  daily_summary: false     # true = email también los días sin nada que hacer
  state_path: state/etf_alerts.json
  symbols:
    - {ticker: SPY, mt5: SPY.P}
    - {ticker: QQQ, mt5: QQQ.OQ}

alerts:
  max_alert_age_minutes: 30      # no se envían alertas más antiguas (p.ej. al arrancar)
  dry_run: false                 # true = se escriben en el log en vez de enviarse por email
  smtp_host: smtp.gmail.com
  smtp_port: 465

state:
  path: state/state.json
  keep_days: 30                  # setups finalizados más antiguos se purgan

loop:
  interval_seconds: 60
  candle_close_delay_seconds: 10 # margen tras el cierre de la vela para que llegue el dato

logging:
  file: logs/eurusd_alerts.log
  level: INFO
  max_bytes: 5000000
  backup_count: 5
